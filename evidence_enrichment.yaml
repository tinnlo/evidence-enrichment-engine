default_mode: auto
replay_dir: examples/replay
prompt_dir: prompts
thresholds:
  hq_country:
    auto_approve_min_confidence: 0.85
    review_min_confidence: 0.50
search:
  provider_order:
    - serper
    - tavily
analysis:
  provider_order:
    - openai
    - anthropic
synthesis:
  provider_order:
    - openai
    - anthropic
retrieval:
  # Set mode to "local" to enable retrieval-augmented analysis.
  # Requires OPENAI_API_KEY for embeddings (text-embedding-3-small).
  mode: "off"
  persist_path: examples/output/chroma
  chunk_size: 1500
  overlap: 200
  max_table_size: 4000
  top_k: 5
  embedding_model: text-embedding-3-small
  min_doc_chars: 2000

finops:
  enabled: true
  budget_mode: "off"
  openai_cheap_model: "gpt-5-mini"
  anthropic_cheap_model: "claude-sonnet-4.6"

# Execution policy governs capability (which live surfaces the agent may use).
# Separate from finops, which governs cost.
# mode: "off" | "audit" | "enforce"
# allowed_actions: list of permitted live-capability surfaces.
# Defaults are replay-safe: mode=off, all actions allowed.
execution_policy:
  enabled: true
  mode: "off"
  allowed_actions:
    - search
    - fetch
    - retrieval
    - remote_tracing
    - live_provider_calls
    - mcp_live_runs

ns

