services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  pipeline:
    build: .
    env_file: .env
    volumes:
      - ./examples:/app/examples
      - ./evals:/app/evals
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - CACHE_ENABLED=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379

volumes:
  redis_data: